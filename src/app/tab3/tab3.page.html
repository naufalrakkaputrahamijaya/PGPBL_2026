<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 3
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form class="schedule-form" (ngSubmit)="submitSchedule()">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Tambah Jadwal</ion-card-title>
        <ion-card-subtitle>Jadwal akan disimpan dan ditampilkan di Tab 2.</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-input [(ngModel)]="schedule.subject" name="subject" label="Mata Kuliah" label-placement="stacked" placeholder="Masukkan nama mata kuliah" required></ion-input>
        </ion-item>
        <ion-item>
          <ion-input [(ngModel)]="schedule.day" name="day" label="Hari" label-placement="stacked" placeholder="Contoh: Senin" required></ion-input>
        </ion-item>
        <ion-item>
          <ion-input [(ngModel)]="schedule.time" name="time" label="Jam" label-placement="stacked" placeholder="Contoh: 09.00 - 10.40" required></ion-input>
        </ion-item>
        <ion-item>
          <ion-input [(ngModel)]="schedule.room" name="room" label="Ruang" label-placement="stacked" placeholder="Masukkan nama ruang" required></ion-input>
        </ion-item>
        <ion-button class="submit-button" expand="block" type="submit">
          Simpan Jadwal
        </ion-button>
      </ion-card-content>
    </ion-card>
  </form>
</ion-content>
